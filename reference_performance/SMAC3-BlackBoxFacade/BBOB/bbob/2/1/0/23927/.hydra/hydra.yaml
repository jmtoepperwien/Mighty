hydra:
  run:
    dir: ${outdir}
  sweep:
    dir: ${baserundir}
    subdir: ${optimizer_id}/${benchmark_id}/${task_id}/${seed}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      colorlog:
        (): colorlog.ColoredFormatter
        format: '[%(cyan)s%(asctime)s%(reset)s][%(purple)sHYDRA%(reset)s] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
      colorlog:
        (): colorlog.ColoredFormatter
        format: '[%(cyan)s%(asctime)s%(reset)s][%(blue)s%(name)s%(reset)s][%(log_color)s%(levelname)s%(reset)s]
          - %(message)s'
        log_colors:
          DEBUG: purple
          INFO: green
          WARNING: yellow
          ERROR: red
          CRITICAL: red
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath:
  - pkg://dacboenv/configs
  - pkg://adaptaf/configs
  - pkg://optbench/configs
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.searchpath=['pkg://dacboenv/configs','pkg://adaptaf/configs','pkg://optbench/configs']
    - hydra.mode=MULTIRUN
    task:
    - seed=23927
    - +task/BBOB=cfg_2_1_0
    - +optimizer/smac20=blackbox
    - baserundir=reference_performance
  job:
    name: run
    chdir: null
    override_dirname: +optimizer/smac20=blackbox,+task/BBOB=cfg_2_1_0,baserundir=reference_performance,seed=23927
    id: '2'
    num: 2
    config_name: base.yaml
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/mtoepperwien/Documents/Mighty
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/mtoepperwien/Documents/Mighty/.venv/lib/python3.11/site-packages/carps/configs
      schema: file
      provider: main
    - path: hydra_plugins.hydra_colorlog.conf
      schema: pkg
      provider: hydra-colorlog
    - path: dacboenv.configs
      schema: pkg
      provider: hydra.searchpath in command-line
    - path: adaptaf.configs
      schema: pkg
      provider: hydra.searchpath in command-line
    - path: optbench.configs
      schema: pkg
      provider: hydra.searchpath in command-line
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/mtoepperwien/Documents/Mighty/reference_performance/SMAC3-BlackBoxFacade/BBOB/bbob/2/1/0/23927
    choices:
      optimizer/smac20: blackbox
      task/BBOB: cfg_2_1_0
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: colorlog
      hydra/hydra_logging: colorlog
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
